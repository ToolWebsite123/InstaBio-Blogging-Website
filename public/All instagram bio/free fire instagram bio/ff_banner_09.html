<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:680px;height:380px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;}
.bg{
  width:680px;height:380px;
  background:linear-gradient(135deg,#001a1a,#003333,#005555);
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:9px 36px 7px;
}
/* Scan line effect */
.scanlines{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;z-index:0;
}
.glow1{position:absolute;top:-70px;left:-70px;width:240px;height:240px;border-radius:50%;background:#00FFFF;opacity:0.1;filter:blur(50px);pointer-events:none;}
.glow2{position:absolute;bottom:-70px;right:-70px;width:280px;height:280px;border-radius:50%;background:#AAFFFF;opacity:0.07;filter:blur(55px);pointer-events:none;}
.corner-tl{position:absolute;top:6px;left:6px;width:20px;height:20px;border-top:2px solid #00FFFF;border-left:2px solid #00FFFF;opacity:0.4;border-radius:3px 0 0 0;pointer-events:none;}
.corner-tr{position:absolute;top:6px;right:6px;width:20px;height:20px;border-top:2px solid #00FFFF;border-right:2px solid #00FFFF;opacity:0.4;border-radius:0 3px 0 0;pointer-events:none;}
.corner-bl{position:absolute;bottom:6px;left:6px;width:20px;height:20px;border-bottom:2px solid #00FFFF;border-left:2px solid #00FFFF;opacity:0.4;border-radius:0 0 0 3px;pointer-events:none;}
.corner-br{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border-bottom:2px solid #00FFFF;border-right:2px solid #00FFFF;opacity:0.4;border-radius:0 0 3px 0;pointer-events:none;}
.head-wrap{text-align:center;z-index:2;}
.headline{
  color:#fff;font-size:19px;font-weight:900;
  text-shadow:0 0 20px #00FFFF,0 2px 14px rgba(0,0,0,0.7);
  letter-spacing:-0.3px;line-height:1.2;
}
.subtitle{
  color:#00FFFF;font-size:11.5px;font-weight:700;
  margin-top:3px;letter-spacing:0.5px;
  text-shadow:0 0 10px #00FFFF,0 1px 6px rgba(0,0,0,0.5);
}
.card{
  background:#fff;border-radius:16px;width:608px;
  box-shadow:0 0 30px #00FFFF33,0 16px 50px rgba(0,0,0,0.5);
  overflow:hidden;z-index:2;
  border:1.5px solid #00FFFF44;
}
.card-top{
  display:flex;align-items:center;
  padding:12px 15px 10px;gap:12px;
  background:#fff;border-bottom:1.5px solid #f0f0f0;
}
.av-outer{
  flex-shrink:0;width:82px;height:82px;border-radius:50%;
  padding:3px;background:linear-gradient(135deg,#001a1a,#003333,#005555);
  box-shadow:0 0 20px #00FFFF66,0 4px 18px rgba(0,0,0,0.4);
}
.av-inner{
  width:76px;height:76px;border-radius:50%;
  overflow:hidden;border:2.5px solid #fff;
}
.av-inner img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
.badge-pill{
  display:inline-block;
  background:linear-gradient(135deg,#001a1a,#003333,#005555);
  color:#00FFFF;font-size:9px;font-weight:800;
  padding:2px 10px;border-radius:20px;
  margin-top:4px;letter-spacing:0.5px;
  border:1px solid #00FFFF88;
  text-shadow:0 0 8px #00FFFF;
}
.right-col{flex:1;display:flex;flex-direction:column;gap:8px;}
.uname{font-size:13px;font-weight:800;color:#111;letter-spacing:-0.2px;}
.stats-row{display:flex;gap:16px;}
.stat{text-align:center;}
.snum{font-size:16px;font-weight:800;color:#111;}
.slabel{font-size:9.5px;color:#888;margin-top:1px;}
.btn-row{display:flex;gap:7px;}
.edit-btn{background:#fff;border:1.5px solid #dbdbdb;border-radius:8px;padding:5px 13px;font-size:11px;font-weight:600;color:#111;}
.follow-btn{
  background:linear-gradient(135deg,#001a1a,#003333,#005555);
  border:1px solid #00FFFF;
  border-radius:8px;padding:5px 12px;
  font-size:11px;font-weight:700;
  color:#00FFFF;
  text-shadow:0 0 8px #00FFFF;
}
.ig-badge{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,#001a1a,#003333,#005555);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 15px #00FFFF55,0 2px 12px rgba(0,0,0,0.3);
  border:1px solid #00FFFF66;
}
.bio-area{padding:9px 16px 9px;background:#fff;}
.site-link{
  font-size:10.5px;font-weight:700;
  color:#00FFFF;margin-bottom:4px;display:block;
}
.domain-bar{
  text-align:center;z-index:2;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.domain{
  color:rgba(255,255,255,0.75);font-size:10.5px;
  font-weight:700;letter-spacing:2px;text-transform:uppercase;
}
.dpill{
  background:#00FFFF;color:#000;
  font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px;
  box-shadow:0 0 8px #00FFFF;
}
</style>
</head>
